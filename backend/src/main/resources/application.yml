server:
  port: 8080

spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:cryptotracker}
    username: ${DB_USER:cryptotracker}
    password: ${DB_PASSWORD:cryptotracker}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-value-before-running}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:30}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:30}
  coingecko:
    base-url: ${COINGECKO_API_BASE_URL:https://api.coingecko.com/api/v3}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
