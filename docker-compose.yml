services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cryptotracker}
      POSTGRES_USER: ${DB_USER:-cryptotracker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cryptotracker}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
